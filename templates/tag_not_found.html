<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>标签不存在 - 元数据管理</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏷️</text></svg>">
    <link href="/static/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/bootstrap-icons.min.css">
</head>
<body>
    <div class="container mt-5">
        <nav aria-label="breadcrumb" class="mb-3">
            <ol class="breadcrumb">
                <li class="breadcrumb-item"><a href="/databases" class="text-decoration-none">数据库</a></li>
                <li class="breadcrumb-item"><a href="/tags" class="text-decoration-none">标签管理</a></li>
                <li class="breadcrumb-item active" aria-current="page">标签不存在</li>
            </ol>
        </nav>
        
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header bg-warning text-dark">
                        <h5 class="mb-0"><i class="bi bi-exclamation-triangle"></i> 标签不存在</h5>
                    </div>
                    <div class="card-body text-center py-5">
                        <i class="bi bi-question-circle" style="font-size: 4rem; color: #6c757d;"></i>
                        <h4 class="mt-3">标签 "{{ tag_name }}" 不存在</h4>
                        <p class="text-muted">您想创建这个标签吗？</p>
                        <div class="mt-4">
                            <button type="button" class="btn btn-primary" id="createTagBtn">
                                <i class="bi bi-plus-circle"></i> 创建标签
                            </button>
                            <a href="/tags" class="btn btn-outline-secondary ms-2">
                                <i class="bi bi-arrow-left"></i> 返回标签列表
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <div class="modal fade" id="createTagModal" tabindex="-1" aria-labelledby="createTagModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="createTagModalLabel">创建新标签</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="createTagForm">
                        <div class="mb-3">
                            <label for="tag_name" class="form-label">标签名称</label>
                            <input type="text" class="form-control" id="tag_name" name="tag_name" value="{{ tag_name }}" required>
                        </div>
                        <div class="mb-3">
                            <label for="description" class="form-label">描述</label>
                            <textarea class="form-control" id="description" name="description" rows="3" maxlength="500" placeholder="请输入标签描述（可选）"></textarea>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                    <button type="button" class="btn btn-primary" id="confirmCreateBtn">创建</button>
                </div>
            </div>
        </div>
    </div>
    
    <script src="/static/js/bootstrap.bundle.min.js"></script>
    <script>
        const createTagBtn = document.getElementById('createTagBtn');
        const createTagModal = new bootstrap.Modal(document.getElementById('createTagModal'));
        const confirmCreateBtn = document.getElementById('confirmCreateBtn');
        const tagNameInput = document.getElementById('tag_name');
        const descriptionInput = document.getElementById('description');
        
        createTagBtn.addEventListener('click', function() {
            createTagModal.show();
        });
        
        confirmCreateBtn.addEventListener('click', function() {
            const tagName = tagNameInput.value.trim();
            const description = descriptionInput.value.trim();
            
            if (!tagName) {
                alert('标签名称不能为空');
                return;
            }
            
            const formData = new FormData();
            formData.append('tag_name', tagName);
            formData.append('description', description);
            
            confirmCreateBtn.disabled = true;
            confirmCreateBtn.innerHTML = '<span class="spinner-border spinner-border-sm"></span> 创建中...';
            
            fetch('/tags/add', {
                method: 'POST',
                body: formData
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    window.location.href = '/tags/name/' + encodeURIComponent(tagName);
                } else {
                    alert(data.message);
                    confirmCreateBtn.disabled = false;
                    confirmCreateBtn.innerHTML = '创建';
                }
            })
            .catch(error => {
                alert('创建失败：' + error);
                confirmCreateBtn.disabled = false;
                confirmCreateBtn.innerHTML = '创建';
            });
        });
        
        document.getElementById('createTagModal').addEventListener('hidden.bs.modal', function() {
            confirmCreateBtn.disabled = false;
            confirmCreateBtn.innerHTML = '创建';
        });
    </script>
</body>
</html>
